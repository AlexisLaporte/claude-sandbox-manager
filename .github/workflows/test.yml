name: test

# Les tests hors box de l'agent : bibliothèque standard seule, sans systemd ni root
# (`python3 -m unittest discover -s tests -p 'test_*.py'`). Les textes de run y sont
# factices. Ce qui ne se prouve que sur la box (brides réelles, D-Bus, /proc) reste
# dans `tests/isolation.py` et `tests/banc_read.py`, lancés au déploiement.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - name: Tests unitaires
        run: python3 -m unittest discover -s tests -p 'test_*.py'
